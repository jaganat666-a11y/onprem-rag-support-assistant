# On-prem LLM/RAG support assistant: inference, facade, journal, observability.
#
#   docker compose --profile gpu up -d   # whole stand, incl. vLLM on the GPU
#   docker compose up -d                 # CPU part only (no NVIDIA GPU needed)
#
# Services that need the GPU (vllm, gpu-exporter) live in the `gpu` profile, so
# the CPU part starts on any machine; without vLLM the facade answers
# /health 503 and /ask 502 (degraded, not crashed). Everything else reaches
# vLLM by its compose service name: http://vllm:8000.
# Logging: Loki + Promtail aggregate the facade's stdout (job="facade").
# Postgres keeps the /ask request journal — the on-call SQL layer (docs/sql.md).

services:
  # Inference server: OpenAI-compatible API on :8000, Prometheus metrics on the
  # same port (/metrics). Image pinned to the version the eval ran on.
  vllm:
    image: vllm/vllm-openai:v0.23.0
    container_name: vllm
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    ipc: host   # PyTorch shares tensors via /dev/shm; the default 64 MB is too small
    volumes:
      # model weights (~5.2 GB) persist on the host and are pulled only once
      - ${VLLM_HF_CACHE:-~/vllm-hf-cache}:/root/.cache/huggingface
    command:
      - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
      - --served-model-name=qwen2.5-7b
      - --max-model-len=8192
      # 0.85 of 8 GB: weights + KV cache; the rest stays for the desktop
      - --gpu-memory-utilization=0.85
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # 200 once the model is loaded; loading takes ~1-3 min, hence start_period
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # password comes from .env (see .env.example); falls back to admin for local-only use
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    restart: unless-stopped

  # host-level metrics (CPU, RAM, disk, network) of the box running the stack
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped

  # GPU metrics (utilisation, VRAM, power, temperature) via nvidia-smi
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: gpu-exporter
    profiles: ["gpu"]
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    restart: unless-stopped

  # Log aggregation: Loki stores logs, Grafana queries them with LogQL.
  # Single-binary, filesystem storage (see monitoring/loki/loki-config.yml).
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  # Promtail tails container stdout via the Docker socket and ships it to Loki.
  # We scrape ONLY the facade -> label job="facade" (see promtail-config.yml).
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # read-only access to the Docker API for service discovery + log streaming
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Request journal for /ask — the SQL layer of the stand. The facade INSERTs
  # one row per handled request (question, status, latency, tokens, sources);
  # the on-call engineer diagnoses with SQL (docs/sql.md). The journal is
  # auxiliary BY DESIGN: if Postgres is down, /ask keeps working — the facade
  # downgrades the failed INSERT to a WARNING log line instead of a 5xx.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=facade
      # password comes from .env (see .env.example); local-only fallback
      - POSTGRES_PASSWORD=${PG_PASSWORD:-facade}
      - POSTGRES_DB=asklog
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # schema bootstrap: runs ONCE on the first start with an empty data volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facade -d asklog"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Thin FastAPI facade over the RAG layer (/ask, /feedback, /health). CPU-only: the
  # bge-m3 embedder and reranker run on CPU; generation is sent to the `vllm`
  # service over HTTP (VLLM_BASE). No GPU reservation here — that is
  # deliberate (the facade must never contend for the device). No depends_on
  # on vllm either: the facade starts without it and reports itself degraded.
  facade:
    build:
      context: .
      dockerfile: facade/Dockerfile
    container_name: facade
    ports:
      - "8080:8080"
    environment:
      - VLLM_BASE=${VLLM_BASE:-http://vllm:8000/v1}
      - HF_HOME=/root/.cache/huggingface
      # /ask journal (see `postgres` service above); empty PG_DSN = journaling off
      - PG_DSN=postgresql://facade:${PG_PASSWORD:-facade}@postgres:5432/asklog
      # retrieval knobs for speed/quality experiments (docs/eval.md); change and
      # `docker compose up -d facade` recreates the container, no rebuild needed
      - RAG_RERANK=${RAG_RERANK:-1}
      - RAG_CAND_K=${RAG_CAND_K:-12}
      # below this top rerank score the model is not called: "not in runbooks" + escalate
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.3}
      # model context = up to N whole runbooks above RAG_MIN_SCORE; 0 = old top-K fragments
      - RAG_CTX_RUNBOOKS=${RAG_CTX_RUNBOOKS:-2}
    depends_on:
      - postgres
    volumes:
      # model weights (bge-m3 + reranker) persist across restarts; pulled once
      - facade-hf-cache:/root/.cache/huggingface
    healthcheck:
      # 200 only when the index is loaded AND vLLM answers; start_period covers
      # the ~10-70s CPU warm-up of bge-m3 + reranker before the first 200.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  facade-hf-cache:
  loki-data:
  promtail-positions:
  postgres-data:
