# Линт в CI ловит ошибки, а не стиль: pyflakes (F — неопределённые имена,
# неиспользуемые импорты) и грубые ошибки pycodestyle (E4/E7/E9).
# Широкий набор правил по умолчанию в новых ruff ругается и на намеренные
# решения — например, `except Exception` в журнале запросов: падение БД не
# должно ронять /ask (facade/app.py).
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
