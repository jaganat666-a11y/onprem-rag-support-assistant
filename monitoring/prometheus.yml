global:
  scrape_interval: 15s

scrape_configs:
  # vLLM exposes Prometheus metrics on its OpenAI-compatible server (compose service)
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']

  # host CPU / RAM / disk / network
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # GPU utilisation / VRAM / power / temperature
  - job_name: gpu
    static_configs:
      - targets: ['gpu-exporter:9835']
