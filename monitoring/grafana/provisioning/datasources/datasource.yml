apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    # метрики (Prometheus) и логи (Loki) живут в одной Grafana — отдельный ELK не нужен
    isDefault: false
